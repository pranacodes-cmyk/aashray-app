name: Aashray first internal draft
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: tar -xzf aashray-source.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare standalone Android build
        working-directory: yeshu_app
        run: |
          cp android/app/build.gradle.kts /tmp/aashray-app.gradle.kts
          cp android/settings.gradle.kts /tmp/aashray-settings.gradle.kts
          flutter create --platforms=android --org com.aashray --project-name aashray .
          cp /tmp/aashray-app.gradle.kts android/app/build.gradle.kts
          cp /tmp/aashray-settings.gradle.kts android/settings.gradle.kts
          rm -rf android/app/src/main/kotlin
          flutter pub get
      - name: Configure independent signing
        env:
          KEYSTORE: ${{ secrets.AASHRAY_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.AASHRAY_UPLOAD_KEY_PASSWORD }}
        working-directory: yeshu_app
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=aashray-upload\nkeyPassword=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      - name: Flutter regression tests
        working-directory: yeshu_app
        run: flutter test
      - name: Build signed bundle and emulator APK
        working-directory: yeshu_app
        run: |
          flutter build appbundle --release --build-name=1.0.0 --build-number=1
          flutter build apk --release --target-platform android-x64 --build-name=1.0.0 --build-number=1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh install, cold start and data-cleared start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aashray-first-build
          path: |
            yeshu_app/build/app/outputs/bundle/release/app-release.aab
            smoke/
      - name: Upload first internal draft only
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install google-auth requests
          python3 upload-draft.py